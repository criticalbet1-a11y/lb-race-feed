name: scrape
# GitHub's schedule on this repo is unreliable (it never fired), so one run
# loops: scrape every 10 min for ~5h35m, then dispatches its successor.
# The hourly cron is only a watchdog that restarts the chain if it ever breaks;
# the concurrency group keeps at most one loop running (one queued at most).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Previous feed + state (data branch)
        run: |
          mkdir -p data
          git fetch -q --depth=1 origin data && git --work-tree=data checkout FETCH_HEAD -- . || true
          git reset -q
          ls -la data
      - name: Browser for DuckDice fallback
        run: npm i --no-save --no-audit --no-fund playwright@1.48 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - name: Scrape loop (every 10 min)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_API_KEY_2: ${{ secrets.FIRECRAWL_API_KEY_2 }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: ./loop.sh
      - name: Hand over to the next loop run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scrape.yml -R "$GITHUB_REPOSITORY" --ref main
